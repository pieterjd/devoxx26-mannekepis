services:
  postgres:
    image: postgres:16-alpine
    container_name: waffle-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: waffle_db
      POSTGRES_USER: waffle_user
      POSTGRES_PASSWORD: waffle_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
